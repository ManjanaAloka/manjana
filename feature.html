    <style>
        /*
         * මෙම CSS Styles විශේෂයෙන්ම Love Calculator Section එකට අදාළ වේ.
         * ඔබගේ Portfolio හි මූලික CSS සමඟ ගැටුම් ඇතිවීම අවම කිරීමට
         * class names වලට "love-calc-" prefix එක භාවිතා කර ඇත.
         */
        /* Common Variables (ඔබගේ Portfolio theme එකට ගැලපෙන ලෙස වෙනස් කරන්න) */
        
         :root {
            --love-calc-primary-color: #ff4757;
            /* රතු/රෝස */
            --love-calc-secondary-color: #2f3542;
            /* තද අළු */
            --love-calc-bg-color: #f8f8f8;
            /* ලා අළු පසුබිම (section එකට) */
            --love-calc-card-bg: white;
            /* Card එකේ සුදු පාට */
            --love-calc-text-color: #333;
            --love-calc-border-color: #dfe4ea;
        }
        /* --- Global Body & Main Layout (ඔබගේ Portfolio CSS මගින් මෙය handle කරයි) --- */
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            line-height: 1.6;
            color: var(--love-calc-text-color);
            background-color: #f1f2f6;
            /* උදාහරණයක් ලෙස, ඔබගේ පිටුවේ පසුබිම */
        }
        /* --- Example Header (ඔබගේ Portfolio හි header එක මෙයට සමාන විය හැක) --- */
        
        .portfolio-header {
            background-color: #34495e;
            color: white;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .portfolio-header h1 {
            margin: 0;
            font-size: 2.5em;
        }
        
        .portfolio-nav ul {
            list-style: none;
            padding: 0;
            margin: 10px 0 0;
            display: flex;
            justify-content: center;
        }
        
        .portfolio-nav li {
            margin: 0 15px;
        }
        
        .portfolio-nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        /* --- Love Calculator Section Styles --- */
        
        .love-calc-section {
            background-color: var(--love-calc-bg-color);
            padding: 60px 20px;
            /* Section එකේ padding */
            text-align: center;
            box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.05);
            /* Section එකට shadow එකක් */
            display: flex;
            /* Card එක මැදට ගැනීමට */
            justify-content: center;
            align-items: center;
            min-height: 70vh;
            /* Section එකට අවම උසක් */
        }
        
        .love-calc-section h2 {
            font-size: 2.5em;
            color: var(--love-calc-secondary-color);
            margin-bottom: 40px;
        }
        
        .love-calc-card {
            background: var(--love-calc-card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            /* Card එකේ උපරිම පළල */
            width: 100%;
            margin-top: -20px;
            /* H2 එකට උඩින් යාමට */
        }
        
        .love-calc-card h3 {
            /* Calculator එකේ Title */
            color: var(--love-calc-primary-color);
            font-size: 2em;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .love-calc-card h3::before,
        .love-calc-card h3::after {
            content: "—";
            /* Title දෙපසට ඉරි */
            margin: 0 10px;
            color: #ccc;
        }
        
        .love-calc-input-group {
            margin-bottom: 25px;
            text-align: left;
        }
        
        .love-calc-input-group label {
            display: block;
            margin-bottom: 10px;
            color: var(--love-calc-secondary-color);
            font-weight: 600;
            font-size: 1.1em;
        }
        
        .love-calc-input-group select {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--love-calc-border-color);
            border-radius: 10px;
            font-size: 17px;
            outline: none;
            transition: border-color 0.3s ease;
            -webkit-appearance: none;
            /* Default dropdown arrow අයින් කිරීමට */
            -moz-appearance: none;
            appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23000%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-6.5%200-12.3%203.2-16.1%208.1-3.8%204.9-3.6%2011.8.8%2016.7l126.5%20127.7c3.6%203.6%208.3%205.7%2013.1%205.7s9.5-2.1%2013.1-5.7L287%2086c4.5-4.9%204.7-11.8.9-16.7z%22%2F%3E%3C%2Fsvg%3E');
            /* Custom dropdown arrow */
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 12px;
        }
        
        .love-calc-input-group select:focus {
            border-color: var(--love-calc-primary-color);
            box-shadow: 0 0 0 3px rgba(255, 71, 87, 0.2);
        }
        
        .love-calc-btn {
            background-color: var(--love-calc-primary-color);
            color: white;
            border: none;
            padding: 16px 35px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            width: 100%;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }
        
        .love-calc-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.4);
            background-color: #e53e4f;
            /* තද රතු */
        }
        
        .love-calc-btn:active {
            transform: translateY(-2px);
            box-shadow: 0 3px 10px rgba(255, 71, 87, 0.3);
        }
        /* --- Result Display Area (Circular Progress) --- */
        
        .love-calc-result-area {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: translateY(30px);
            transition: 0.6s ease-out;
            /* මන්දගාමී Transition */
        }
        
        .love-calc-result-area.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .love-calc-circular-progress {
            position: relative;
            height: 180px;
            /* ප්‍රමාණය තරමක් විශාල කර ඇත */
            width: 180px;
            border-radius: 50%;
            background: conic-gradient(var(--love-calc-primary-color) 0deg, var(--love-calc-border-color) 0deg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .love-calc-circular-progress::before {
            content: "";
            position: absolute;
            height: 140px;
            /* ඇතුලත රවුමේ ප්‍රමාණය */
            width: 140px;
            border-radius: 50%;
            background-color: var(--love-calc-card-bg);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.05);
        }
        
        .love-calc-progress-value {
            position: relative;
            font-size: 4em;
            /* අකුරු ප්‍රමාණය විශාල කර ඇත */
            font-weight: bold;
            color: var(--love-calc-primary-color);
            z-index: 2;
            /* අනිත් ඒවාට උඩින් පෙන්වීමට */
        }
        
        .love-calc-message {
            margin-top: 25px;
            font-size: 1.4em;
            /* අකුරු ප්‍රමාණය විශාල කර ඇත */
            color: var(--love-calc-secondary-color);
            font-weight: 500;
            line-height: 1.4;
        }
        /* --- Example Footer (ඔබගේ Portfolio හි footer එක මෙයට සමාන විය හැක) --- */
        
        .portfolio-footer {
            background-color: #34495e;
            color: white;
            padding: 20px 0;
            text-align: center;
            margin-top: 50px;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .portfolio-footer p {
            margin: 0;
            font-size: 0.9em;
        }
        /* Responsive adjustments for smaller screens */
        
        @media (max-width: 768px) {
            .love-calc-section {
                padding: 40px 15px;
                min-height: auto;
            }
            .love-calc-card {
                padding: 30px;
                margin-top: 0;
            }
            .love-calc-section h2 {
                font-size: 2em;
                margin-bottom: 30px;
            }
            .love-calc-card h3 {
                font-size: 1.8em;
                margin-bottom: 25px;
            }
            .love-calc-input-group label {
                font-size: 1em;
            }
            .love-calc-input-group select {
                font-size: 15px;
                padding: 12px;
            }
            .love-calc-btn {
                font-size: 1.1em;
                padding: 14px 25px;
            }
            .love-calc-circular-progress {
                height: 140px;
                width: 140px;
            }
            .love-calc-circular-progress::before {
                height: 110px;
                width: 110px;
            }
            .love-calc-progress-value {
                font-size: 3em;
            }
            .love-calc-message {
                font-size: 1.2em;
            }
        }
    </style>

</head>
